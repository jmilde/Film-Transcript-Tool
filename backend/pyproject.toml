[project]
name = "backend"
version = "0.1.0"
description = "Film Transcript Tool backend (API + worker)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argostranslate>=1.11.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.mypy]
strict = true
files = ["app", "tests"]

# Argos Translate ships no type stubs; treat its API as untyped at the boundary.
[[tool.mypy.overrides]]
module = ["argostranslate.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic migrations: long single-call statements ruff format won't rewrap.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits a real external service (network + credentials); deselect with -m 'not integration'",
]
